<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Back to CAM versus Integra Dental NC Partial Extraction</title>
  <desc id="d">A one million line program stops with an alarm at line 482,113 during tool 2. The old way recalculates and reposts the whole job in CAM and reruns roughing. Partial NC extraction maps the program, picks a restart point, writes and verifies a partial program, and resumes after an air cut.</desc>
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#83858B"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#151719"/></marker>
  </defs>
  <rect width="1200" height="720" rx="12" fill="#FFFFFF"/>
  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="40" y="58" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#151719">One alarm at line 482,113. Two ways back.</text>

    <!-- program strip -->
    <g font-size="14" font-weight="700">
      <rect x="40" y="88" width="426" height="40" fill="#E9E7E1"/>
      <rect x="466" y="88" width="448" height="40" fill="#F4F3EF"/>
      <rect x="914" y="88" width="246" height="40" fill="#E9E7E1"/>
      <rect x="40" y="88" width="1120" height="40" fill="none" stroke="#E6E6E6"/>
      <text x="56" y="113" fill="#151719">T1 ROUGHING  lines 1 to 385,000</text>
      <text x="600" y="113" fill="#151719">T2 FINISHING</text>
      <text x="930" y="113" fill="#151719">T3 DETAIL, SUPPORT CUT OFF</text>
      <rect x="540" y="88" width="33" height="40" fill="#2158DA" opacity="0.28"/>
      <line x1="573" y1="78" x2="573" y2="138" stroke="#C8102E" stroke-width="3"/>
      <text x="583" y="156" font-size="14" fill="#C8102E">ALARM, line 482,113</text>
      <text x="536" y="174" font-size="13" font-weight="400" fill="#2158DA" text-anchor="end">restart from the last rapid move</text>
      <text x="1160" y="156" font-size="13" font-weight="400" fill="#65676C" text-anchor="end">1,012,365 lines</text>
    </g>

    <!-- lane A -->
    <text x="40" y="226" font-size="20" font-weight="700" fill="#65676C">Back to CAM</text>
    <text x="180" y="226" font-size="16" fill="#65676C">recalculate and repost the whole job</text>
    <g font-size="15" fill="#151719">
      <rect x="40" y="246" width="166" height="76" rx="8" fill="#F4F3EF"/>
      <text x="56" y="278">Open the case</text><text x="56" y="300">in CAM</text>
      <rect x="226" y="246" width="166" height="76" rx="6" fill="#F4F3EF"/>
      <text x="242" y="278">Recalculate every</text><text x="242" y="300">toolpath</text>
      <rect x="412" y="246" width="166" height="76" rx="6" fill="#F4F3EF"/>
      <text x="428" y="278">Post a new</text><text x="428" y="300">NC file</text>
      <rect x="598" y="246" width="166" height="76" rx="6" fill="#F4F3EF"/>
      <text x="614" y="278">Transfer, reload,</text><text x="614" y="300">check offsets</text>
      <rect x="784" y="246" width="166" height="76" rx="6" fill="#F4F3EF"/>
      <text x="800" y="278">Run T1 roughing</text><text x="800" y="300">again</text>
      <rect x="970" y="246" width="190" height="76" rx="6" fill="#F4F3EF"/>
      <text x="986" y="278">Finally back at</text><text x="986" y="300">line 482,113</text>
    </g>
    <g stroke="#83858B" stroke-width="2" marker-end="url(#arrA)">
      <line x1="207" y1="284" x2="223" y2="284"/><line x1="393" y1="284" x2="409" y2="284"/>
      <line x1="579" y1="284" x2="595" y2="284"/><line x1="765" y1="284" x2="781" y2="284"/>
      <line x1="951" y1="284" x2="967" y2="284"/>
    </g>
    <text x="40" y="352" font-size="15" fill="#65676C">Everything before the alarm runs again, in air or in material. The CAM station and the mill both wait.</text>

    <line x1="40" y1="388" x2="1160" y2="388" stroke="#E6E6E6"/>

    <!-- lane B -->
    <text x="40" y="430" font-size="20" font-weight="700" fill="#151719">Integra Dental NC Partial Extraction</text><text x="412" y="430" font-size="16" fill="#83858B">edit the program you already have</text>
    <g font-size="15" fill="#FFFFFF">
      <rect x="40" y="450" width="206" height="76" rx="6" fill="#181B20"/>
      <text x="56" y="482">Map tool phases</text><text x="56" y="504">and operations</text>
      <rect x="268" y="450" width="206" height="76" rx="6" fill="#181B20"/>
      <text x="284" y="482">Pick the restart</text><text x="284" y="504">point or phase</text>
      <rect x="496" y="450" width="206" height="76" rx="6" fill="#181B20"/>
      <text x="512" y="482">Write the partial</text><text x="512" y="504">program</text>
      <rect x="724" y="450" width="206" height="76" rx="6" fill="#181B20"/>
      <text x="740" y="482">Verify its state</text><text x="740" y="504">against the original</text>
      <rect x="952" y="450" width="208" height="76" rx="6" fill="#181B20"/>
      <text x="968" y="482">Air cut, then</text><text x="968" y="504">resume cutting</text>
    </g>
    <g stroke="#151719" stroke-width="2" marker-end="url(#arrB)">
      <line x1="247" y1="488" x2="265" y2="488"/><line x1="475" y1="488" x2="493" y2="488"/>
      <line x1="703" y1="488" x2="721" y2="488"/><line x1="931" y1="488" x2="949" y2="488"/>
    </g>
    <text x="40" y="556" font-size="15" fill="#151719">About 16 seconds for a million line program in our tests. T1 never runs again. The original toolpath lines are copied unchanged.</text>

    <!-- what the new file holds -->
    <g font-size="13" fill="#151719">
      <rect x="40" y="586" width="1120" height="64" rx="6" fill="#F4F3EF"/>
      <text x="56" y="610" font-weight="700">The new file:</text>
      <text x="160" y="610">original preamble, T2 tool change block, state the original had at that point (S, coolant, G54, feed),</text>
      <text x="160" y="632">G53 safe retract, rotary axes, X Y, then Z down, toolpath from the restart line onward, clean M5 M9 M30.</text>
    </g>
    <line x1="40" y1="668" x2="1160" y2="668" stroke="#E6E6E6"/>
    <text x="40" y="698" font-size="20" font-weight="600" letter-spacing="-0.5" fill="#151719">integra<tspan fill="#2158DA">.</tspan>dental</text>
    <text x="1160" y="697" font-size="14" fill="#65676C" text-anchor="end">Dental CAD/CAM distributor and authorized Arum dealer. MIT License. Always prove out with an air cut.</text>
  </g>
</svg>
